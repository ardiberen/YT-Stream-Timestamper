# Builds the Windows app on GitHub's servers from the public source, runs the tests, and attaches the zip,
# a SHA-256 checksum and a build attestation to a release.
#
#   * Actions tab -> "Release build" -> Run workflow : test build (no release; download it from the run page)
#   * Create a GitHub release (tag like v0.4.2)      : builds and attaches the files to that release
name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write       # attach files to the release
  id-token: write       # build attestation
  attestations: write   # build attestation

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt
          python -c "import yt_dlp, yt_dlp_ejs, google.genai, customtkinter, PIL"
          pip freeze > build-versions.txt

      - name: Add the repo name (for the in-app update notice)
        shell: pwsh
        run: |
          Set-Content -Encoding ascii build_info.py ('GITHUB_REPO = "' + $env:GITHUB_REPOSITORY + '"')
          python -c "import version, updates; assert updates.repo_ok(version.GITHUB_REPO), version.GITHUB_REPO; print('update checks use', version.GITHUB_REPO)"

      - name: Release checks (version tag, README contact)
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $v = (python -c "import version; print(version.APP_VERSION)").Trim()
          "VERSION=$v" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          $tag = $env:TAG
          if ($tag -and $tag -ne "v$v") {
            throw "Release tag '$tag' doesn't match version.py (v$v). Fix one of them and publish again."
          }
          if ($tag -and (Select-String -Path README.md -SimpleMatch "PROJECT_EMAIL_HERE" -Quiet)) {
            throw "README.md still says PROJECT_EMAIL_HERE. Put your project email in the 'Getting help' section first."
          }

      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build the app
        shell: pwsh
        run: |
          python assets/make_version_info.py
          $deno = (Get-Command deno).Source
          pyinstaller --noconfirm --clean --windowed --onedir --name StreamTimestamper `
            --icon assets\icon.ico --version-file version_info.txt --add-data "assets;assets" `
            --collect-all customtkinter --collect-all yt_dlp --collect-all yt_dlp_ejs `
            --collect-all google.genai --collect-all certifi `
            --add-binary "$deno;." app.py
          if (-not (Test-Path dist\StreamTimestamper\StreamTimestamper.exe)) { throw "Build failed: no exe produced" }

      - name: Zip and checksum
        shell: pwsh
        run: |
          $zip = "StreamTimestamper-v$env:VERSION-windows.zip"
          Compress-Archive -Path dist\StreamTimestamper -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          # hash of the exe itself, for people who scan StreamTimestamper.exe (e.g. on VirusTotal) after unzipping
          $exe = "StreamTimestamper-v$env:VERSION-exe.sha256"
          $exeHash = (Get-FileHash dist\StreamTimestamper\StreamTimestamper.exe -Algorithm SHA256).Hash.ToLower()
          "$exeHash  StreamTimestamper.exe" | Out-File -Encoding ascii $exe
          "EXE_SHA=$exe" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "exe SHA-256: $exeHash" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "ZIP=$zip" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "SHA-256: $hash" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.ZIP }}

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:TAG" "${env:ZIP}" "${env:ZIP}.sha256" "${env:EXE_SHA}" build-versions.txt --clobber

      - name: Keep files from a test run
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v6
        with:
          name: test-build
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
            ${{ env.EXE_SHA }}
            build-versions.txt
